<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C4227D" />
    <title>Descargar NED Leal</title>
    <link rel="icon" href="/assets/logo/Logo_NED_ico.png" />
    <link rel="apple-touch-icon" href="/assets/logo/Logo_NED_ico.png" />

    <!-- Open Graph para redes sociales (WhatsApp, Instagram, Facebook, Twitter, etc.) -->
    <meta property="og:title" content="Descarga NED Leal" />
    <meta
      property="og:description"
      content="Consigue la aplicación NED Leal y comienza a disfrutar del poder de la fidelización en Android e iOS."
    />
    <meta property="og:image" content="/assets/logo/Logo_NED_ico.png" />
    <meta property="og:type" content="website" />

    <style>
      :root {
        --brand: #c4227d;
        --brand-dark: #9a1a62;
        --bg: #fafafa;
        --card-bg: #ffffff;
        --text: #1a1a1a;
        --muted: #666666;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: var(--card-bg);
        max-width: 420px;
        width: 90%;
        margin: 20px;
        padding: 36px 24px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        margin-bottom: 20px;
        box-shadow: 0 8px 24px rgba(196, 34, 125, 0.2);
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
        color: var(--text);
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(196, 34, 125, 0.2);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 20px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: var(--brand);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--brand-dark);
      }
      .btn-secondary {
        background: #f0f0f0;
        color: #333333;
      }
      .btn-secondary:hover {
        background: #e4e4e4;
      }
    </style>

    <script>
      (function () {
        const PLAY_STORE_URL =
          "https://play.google.com/store/apps/details?id=com.nedsystem.movil";
        const APP_STORE_URL =
          "https://apps.apple.com/app/nedleal/id6760373778";

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isMac =
          /Macintosh|MacIntel|MacPPC|Mac68K/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        const targetUrl = isIOS || isMac ? APP_STORE_URL : PLAY_STORE_URL;

        // Redirige de inmediato
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <img
        src="/assets/logo/Logo_NED_ico.png"
        alt="Logo NED Leal"
        class="logo"
      />
      <div class="spinner"></div>
      <h1>Redirigiendo a tu tienda...</h1>
      <p>
        Si no se abre automáticamente en unos segundos, selecciona tu dispositivo:
      </p>

      <div class="buttons">
        <a
          href="https://apps.apple.com/app/nedleal/id6760373778"
          class="btn btn-primary"
        >
          🍏 Descargar en App Store
        </a>
        <a
          href="https://play.google.com/store/apps/details?id=com.nedsystem.movil"
          class="btn btn-secondary"
        >
          🤖 Descargar en Google Play
        </a>
      </div>
    </div>
  </body>
</html>
